name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate Agent Skill
        run: skills-ref validate skills/artifact-spec

      - name: Validate plugin manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null

      - name: Check SKILL.md length
        run: test "$(wc -l < skills/artifact-spec/SKILL.md)" -le 500

      - name: Build release archives
        run: ./scripts/package.sh
